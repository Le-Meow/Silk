<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#25271c"><meta name="description" content="An unhurried web-weaving game. Connect knots of silk and watch the dew gather in a sunlit garden.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png">
<title>Silk · The weaving garden</title></head>
<body><main id="game">
<canvas id="scene" aria-label="Three-dimensional garden and living silk web"></canvas><div class="veil"></div>
<header><span class="wordmark">Silk</span><div id="tools" hidden>
<button id="undo" disabled>Undo</button><button id="sound" aria-pressed="true">Sound on</button><button id="pause" aria-label="Pause game" aria-keyshortcuts="Escape"><span aria-hidden="true"></span></button></div></header>
<div id="hud" hidden><span><strong id="strands">0</strong> <span id="strand-label">strands</span></span><i>·</i><span><strong id="loops">0</strong> <span id="loop-label">loops</span></span></div>
<div id="marks" hidden><div id="preview"></div><div id="origin"></div><div id="glimmer" hidden></div></div>
<section id="menu"><h1 id="title">The weaving garden</h1><p id="copy">One spider, a little morning light, and room to spin. Choose a glowing knot to lay your first thread.</p>
<p id="menu-keys"><kbd>WASD</kbd> to crawl · <kbd>Shift</kbd> to weave · <kbd>E</kbd> to choose a knot · <kbd>Space</kbd> to pluck</p>
<button id="begin" aria-keyshortcuts="Enter" disabled>Opening the garden…</button></section>
<section id="guide" hidden aria-live="polite"><strong id="event">Your first stitch</strong><p id="hint">Tap the glowing dot or press Weave.</p></section>
<div id="controller" hidden>
<div id="stick" role="group" aria-label="Movement stick. WASD or arrow keys to crawl or aim."><span class="notches"></span><span id="stick-cap"><kbd>WASD</kbd></span></div>
<div class="buttons">
<button type="button" id="next" aria-keyshortcuts="E" aria-label="Select the next knot"><span>Next</span><kbd>E</kbd></button>
<button type="button" id="silk" aria-keyshortcuts="Shift" aria-label="Weave to the selected knot"><span>Weave</span><kbd>Shift</kbd></button>
<button type="button" id="pluck" aria-keyshortcuts="Space" aria-label="Pluck the silk"><span>Pluck</span><kbd>Space</kbd></button>
</div></div>
</main><script type="module" src="./src/main.ts"></script></body></html>
